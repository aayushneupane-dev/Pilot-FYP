<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlexRide - Sign Up</title>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    html,
    body {
      overflow-x: hidden;
      width: 100%;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-dark);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================
       SPLASH SCREEN
    ========================= */

    .splash-screen {
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: splashFade 0.7s ease forwards;
      animation-delay: 2s;
    }

    .splash-content {
      text-align: center;
      animation: logoAnimation 1.2s ease;
    }

    .splash-logo {
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: -2px;
      color: var(--text-dark);
    }

    .splash-logo span {
      color: var(--primary);
    }

    .splash-tagline {
      margin-top: 5px;
      color: var(--text-muted);
      font-size: 0.9rem;
      letter-spacing: 1px;
    }

    .loading-bar {
      width: 180px;
      height: 4px;
      background: #e2e8f0;
      border-radius: 20px;
      margin: 25px auto 0;
      overflow: hidden;
    }

    .loading-progress {
      height: 100%;
      width: 0%;
      background: var(--primary);
      border-radius: 20px;
      animation: loading 2s ease forwards;
    }

    @keyframes loading {
      from {
        width: 0%;
      }

      to {
        width: 100%;
      }
    }

    @keyframes logoAnimation {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.95);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes splashFade {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 8%;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
      border-bottom: 1px solid var(--border-color);
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-dark);
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--primary);
    }

    .nav-links {
      list-style: none;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--primary);
    }

    .btn-login {
      border: 1px solid var(--primary);
      padding: 8px 18px;
      border-radius: 8px;
      color: var(--primary) !important;
    }

    .btn-login:hover {
      background-color: #eff6ff;
    }

    .btn-signup {
      background: var(--primary);
      padding: 8px 18px;
      border-radius: 8px;
      color: #ffffff !important;
    }

    .btn-signup:hover {
      background: var(--primary-hover);
    }

    /* =========================
       SIGNUP CARD
    ========================= */

    .auth-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
      padding: 40px;
      width: 100%;
      max-width: 460px;

      opacity: 0;
      transform: translateY(20px);
      animation: cardAppear 0.7s ease forwards;
      animation-delay: 2.1s;
    }

    @keyframes cardAppear {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .auth-header h2 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .auth-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: #334155;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      background: #ffffff;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: var(--primary);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      padding: 12px;
      border-radius: 10px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #dc2626;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 14px;
        padding: 1rem 5%;
      }

      .nav-links {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
      }

      .auth-wrapper {
        padding: 20px 15px;
      }

      .auth-card {
        padding: 24px 20px;
      }

      .splash-logo {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       SPLASH SCREEN
  ========================= -->

  <div class="splash-screen">
    <div class="splash-content">

      <div class="splash-logo">
        Flex<span>Ride</span>
      </div>

      <div class="splash-tagline">
        RENT • RIDE • EARN
      </div>

      <div class="loading-bar">
        <div class="loading-progress"></div>
      </div>

    </div>
  </div>


  <!-- =========================
       NAVIGATION
  ========================= -->

  <nav class="navbar">

    <div class="logo">
      Flex<span>Ride</span>
    </div>

    <ul class="nav-links">
      <li>
        <a href="index.html">Home</a>
      </li>

      <li>
        <a href="blog.html">Blog</a>
      </li>

      <li>
        <a href="reviews.html">Reviews</a>
      </li>

      <li>
        <a href="login.html" class="btn-login">
          Log In
        </a>
      </li>

      <li>
        <a href="signup.html" class="btn-signup active">
          Sign Up
        </a>
      </li>
    </ul>

  </nav>


  <!-- =========================
       SIGNUP FORM
  ========================= -->

  <main class="auth-wrapper">

    <div class="auth-card">

      <div class="auth-header">

        <h2>Create an Account</h2>

        <p>
          Start renting vehicles for ride-sharing & deliveries
        </p>

      </div>


      <form id="signup-form">

        <!-- NAME -->

        <div class="form-group">

          <label for="signup-name">
            Full Name
          </label>

          <input
            type="text"
            id="signup-name"
            required
            placeholder="e.g. Suman Gurung"
          >

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label for="signup-email">
            Email Address
          </label>

          <input
            type="email"
            id="signup-email"
            required
            placeholder="name@example.com"
          >

        </div>


        <!-- SERVICE -->

        <div class="form-group">

          <label for="signup-service">
            Primary Driving Service
          </label>

          <select id="signup-service" required>

            <option value="">
              Select your service
            </option>

            <option value="Pathao">
              Pathao Driver / Courier
            </option>

            <option value="InDrive">
              InDrive Driver
            </option>

            <option value="Foodmandu">
              Foodmandu Delivery
            </option>

            <option value="Independent">
              Independent / Other
            </option>

          </select>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label for="signup-password">
            Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="signup-password"
              required
              minlength="8"
              placeholder="At least 8 characters"
            >

            <button
              type="button"
              class="show-password"
              id="show-password"
            >
              Show
            </button>

          </div>

        </div>


        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

          <label for="signup-confirm-password">
            Confirm Password
          </label>

          <div class="password-wrapper">

            <input
              type="password"
              id="signup-confirm-password"
              required
              minlength="8"
              placeholder="Repeat your password"
            >

            <button
              type="button"
              class="show-password"
              id="show-confirm-password"
            >
              Show
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="btn-submit"
        >
          Create Account
        </button>

        <div
          id="signup-message"
          class="message"
        ></div>

      </form>


      <div class="auth-footer">

        Already have an account?

        <a href="login.html">
          Log In
        </a>

      </div>

    </div>

  </main>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script>

    const signupForm =
      document.getElementById("signup-form");

    const signupMessage =
      document.getElementById("signup-message");


    /* PASSWORD VISIBILITY */

    document
      .getElementById("show-password")
      .addEventListener("click", function () {

        const password =
          document.getElementById("signup-password");

        if (password.type === "password") {

          password.type = "text";
          this.textContent = "Hide";

        } else {

          password.type = "password";
          this.textContent = "Show";

        }

      });


    document
      .getElementById("show-confirm-password")
      .addEventListener("click", function () {

        const password =
          document.getElementById("signup-confirm-password");

        if (password.type === "password") {

          password.type = "text";
          this.textContent = "Hide";

        } else {

          password.type = "password";
          this.textContent = "Show";

        }

      });


    /* SIGNUP */

    signupForm.addEventListener("submit", function (e) {

      e.preventDefault();


      const name =
        document.getElementById("signup-name").value.trim();

      const email =
        document.getElementById("signup-email").value.trim();

      const service =
        document.getElementById("signup-service").value;

      const password =
        document.getElementById("signup-password").value;

      const confirmPassword =
        document.getElementById("signup-confirm-password").value;


      /* PASSWORD CHECK */

      if (password.length < 8) {

        signupMessage.textContent =
          "Password must contain at least 8 characters.";

        signupMessage.className =
          "message error";

        return;

      }


      /* CONFIRM PASSWORD */

      if (password !== confirmPassword) {

        signupMessage.textContent =
          "Passwords do not match.";

        signupMessage.className =
          "message error";

        return;

      }


      /* SAVE DEMO ACCOUNT */

      const user = {

        name: name,

        email: email,

        service: service,

        password: password

      };


      localStorage.setItem(
        "flexrideUser",
        JSON.stringify(user)
      );

 

      alert(
        "Account created successfully for " +
        name +
        "! Redirecting to login..."
      );


      window.location.href = "login.html";

    });

  </script>

</body>
</html>
